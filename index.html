<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SyncRoman</title>
  <!-- Home page styles -->
  <link rel="stylesheet" href="homepage/style.css" />
  <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
  <link rel="shortcut icon" href="/icons/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">

  <meta name="apple-mobile-web-app-title" content="SyncRoman">

  <link rel="manifest" href="/icons/site.webmanifest">
</head>

<body>

  <!-- Home search and results UI -->
  <main>
    <div class="top-home-links">
      <a class="top-home-link" href="about/about.html">About</a>
      <a class="top-home-link" href="contribute/index.html">Contribute</a>
    </div>
    <h1>SyncRoman</h1>
    <div id="stats-bar">
      <span id="total-count">0 songs</span>
      <span id="db-status"></span>
    </div>
    <p id="status">Loading...</p>
    <p id="song-count">0 songs</p>

    <div class="search-controls">
      <input id="song-search" type="text" placeholder="Search..." />
      <button id="song-search-btn">Search</button>
      <button id="song-search-clear-btn">Clear</button>
    </div>


    <ul id="song-list"></ul>

  </main>


  <!-- Lyrics preview modal (opened by homepage/ui.js) -->
  <div id="lyrics-preview-modal" hidden>
    <div>
      <h3>Preview</h3>
      <pre id="lyrics-preview-box">Loading...</pre>

      <button id="preview-copy-btn">Copy</button>
      <button id="preview-download-btn">Download</button>
      <button id="preview-close-btn">Close</button>
    </div>
  </div>

  <!-- Script load order matters: config/client first, then feature modules, then app entry -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="utils/config.js" defer></script>
  <script src="utils/supabase.js" defer></script>
  <script src="utils/utils.js" defer></script>
  <script src="homepage/ui.js" defer></script>
  <script src="homepage/songs.js" defer></script>
  <script src="homepage/lyrics.js" defer></script>
  <script src="homepage/stats.js" defer></script>
  <script src="homepage/app.js" defer></script>

</body>
</html>
